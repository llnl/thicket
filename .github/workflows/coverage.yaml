name: unit tests to collect code coverage

on:
  push:
    branches: [ develop ]
    secrets:
      THICKET_CODECOV_TOKEN:
        required: true

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python3 Dependencies
      run: |
        python -m pip install --upgrade pip pytest setuptools wheel
        # Install hatchet first: pandas 3 support is on its develop branch, and
        # requirements.txt cannot be resolved against released hatchet versions
        python -m pip install git+https://github.com/LLNL/hatchet.git@develop
        pip install -r requirements.txt
        # Optional Dependency for HDF Checkpointing
        pip install tables
        python setup.py install
        python setup.py build_ext --inplace
        python -m pip list

    - name: Install coverage tools
      run: |
        pip install codecov
        pip install pytest-cov

    - name: Basic Test with pytest
      run: |
        PYTHONPATH=. $(which pytest) --cov=./ --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      env:
        CODECOV_TOKEN: ${{ secrets.THICKET_CODECOV_TOKEN }}
      with:
        directory: ./coverage/reports
        env_vars: OS,PYTHON
        files: /home/runner/work/hatchet/hatchet/coverage.xml
        flags: unittests
        verbose: true
        fail_ci_if_error: true

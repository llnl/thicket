name: unit tests

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop, releases/** ]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # TODO: add macos-latest
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        # Obtain the latest cached version of npm (either local cache or action cache)
        node-version: node

    - name: Install Python3 Dependencies
      run: |
        python -m pip install --upgrade pip pytest setuptools wheel
        # Install hatchet first: pandas 3 support is on its develop branch, and
        # requirements.txt cannot be resolved against released hatchet versions
        python -m pip install git+https://github.com/LLNL/hatchet.git@develop
        pip install -r requirements.txt
        python setup.py install
        python setup.py build_ext --inplace
        python -m pip list

    - name: Update Black
      if: ${{ matrix.python-version == '3.11' }}
      run: |
        pip install --upgrade click==8.0.4
        pip install black==21.12b0
        pip install flake8==7.3.0

    - name: Lint and Format Check with Flake8 and Black
      if: ${{ matrix.python-version == '3.11' }}
      run: |
        black --diff --check .
        flake8

    - name: Check License Headers
      run: |
        python license.py verify

    # Extra-P is not installed: all Extra-P releases require NumPy < 2, which
    # pandas 3 does not support, so thicket/tests/test_model_extrap.py is skipped.

    - name: Basic Test with pytest
      run: |
        PYTHONPATH=. $(which pytest)

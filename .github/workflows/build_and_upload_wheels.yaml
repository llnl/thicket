name: Build wheels for Thicket

on:
  # Uncomment for testing through a PR
  # pull_request:
  #   branches: [develop, releases/**]
  workflow_dispatch:
  release:
    types:
      - published
  push:
    tags:
      - 'v**'

jobs:

  # TODO: if we ever add compiled code to Thicket (e.g., Cython modules),
  #       remove the build_wheels job
  build_wheels:
    name: Build wheels for Linux
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Get PyPA build
        run: python -m pip install build

      - name: Build wheel for Python ${{ matrix.python_version }}
        run: python -m build -w

      - uses: actions/upload-artifact@v4
        with:
          name: thicket_build_artifacts_wheel-${{ matrix.python-version }}
          path: dist/*.whl
          overwrite: true


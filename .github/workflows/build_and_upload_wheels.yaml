  build_sdist:
    name: Build sdist
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Get PyPA build
        run: python -m pip install build

      - name: Build sdist
        run: python -m build -s

      - uses: actions/upload-artifact@v4
        with:
          name: thicket_build_artifacts_sdist
          path: dist/*.tar.gz

  test_upload_to_pypi:
    needs:
        # - build_wheels_linux_3
        # - build_wheels_linux_27
        # - build_wheels_macos_36_37
        # - build_wheels_macos_38_plus
        # - build_wheels_macos_27
      - build_wheels
      - build_sdist
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: thicket_build_artifacts_*
          merge-multiple: true
          path: dist

      - name: Check build artifacts
        run: |
          ls -lah dist

      - uses: pypa/gh-action-pypi-publish@release/v1.12
        with:
          user: __token__
          password: ${{ secrets.THICKET_TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          attestations: false
          verbose: true

  upload_to_pypi:
    needs:
        # - build_wheels_linux_3
        # - build_wheels_linux_27
        # - build_wheels_macos_36_37
        # - build_wheels_macos_38_plus
        # - build_wheels_macos_27
      - build_wheels
      - build_sdist
    runs-on: ubuntu-22.04
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: thicket_build_artifacts_*
          merge-multiple: true
          path: dist

      - name: Check build artifacts
        run: |
          ls -lah dist

      - uses: pypa/gh-action-pypi-publish@release/v1.12
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
          verbose: true
